[project]
name = "criterio-crm"
version = "0.1.0"
description = "CRM da Critério — comercial, implantação e carteira"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
    "anthropic>=1.8",
    "httpx2>=2.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
# Sem cache em disco: nada de artefato de teste dentro do repositório.

[tool.setuptools.packages.find]
where = ["src"]
