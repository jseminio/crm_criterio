# nginx da tela do crmcs (container sem root, porta 8080).
#
#   navegador ─HTTPS─▶ proxy do Coolify (Traefik) ─HTTP─▶ este nginx :8080
#                                                          ├─ /       → a tela (dist), com fallback de SPA
#                                                          └─ /api/   → API em crmcs-api:8000 (rede interna)
#
# IP real do cliente: o Traefik chega por IP privado e manda X-Forwarded-For. O módulo realip troca o
# $remote_addr pelo primeiro IP de fora das faixas privadas, lido da direita (recursive): um IP que o
# navegador forje à esquerda não é aceito. Esse IP segue para a API em X-Forwarded-For, e a API (que
# confia nas faixas privadas, CRM_PROXY_CONFIAVEL) faz a mesma leitura. O bloqueio de tentativas de
# senha por IP depende disso.

# O nome "crmcs-api" é resolvido a cada pedido pelo DNS do Docker: se a API ainda não subiu (ou foi
# recriada com outro IP), o nginx não cai, só responde 502 até ela voltar. O nome é único (prefixo
# crmcs) porque, no servidor, a rede "coolify" é compartilhada com outros projetos: um "backend"
# genérico poderia resolver para a API de outro projeto.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# O esquema que o navegador usou: o Traefik manda "https"; sem proxy na frente (ensaio local), o daqui.
map $http_x_forwarded_proto $crmcs_esquema {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_upgrade $crmcs_conexao {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Backup e matriz de proposta sobem por arquivo; a API aceita até 200 MB (crm/api/backup.py e
    # crm/api/propostas.py). Abaixo disso o nginx recusaria com 413 antes de a API ver o pedido.
    client_max_body_size 200m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               application/xml text/xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A API já não publica o mapa das rotas com login ligado; aqui elas nem viram a tela (o fallback de
    # SPA responderia 200 com o index.html).
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    location /api/ {
        set $crmcs_api http://crmcs-api:8000;
        proxy_pass $crmcs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $crmcs_esquema;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $crmcs_conexao;
        proxy_read_timeout 300s;      # a IA da ata e a proposta em PowerPoint demoram
        proxy_send_timeout 300s;
        proxy_buffering off;          # downloads grandes (backup, .pptx) saem direto, sem /tmp
    }

    # Arquivos com hash no nome (Vite): cache de um ano.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html nunca em cache: senão o navegador fica preso à versão anterior depois do deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
