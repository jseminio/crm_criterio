[project]
name = "criterio-crm"
version = "0.1.0"
description = "CRM da Critério — comercial, implantação e carteira"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
# Sem cache e sem .pyc dentro do workspace: a verificação do vortexOS varre
# workspaces/ inteiro e artefato de build vira ruído. Ver README.

[tool.setuptools.packages.find]
where = ["src"]
