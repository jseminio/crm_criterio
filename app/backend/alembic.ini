# Alembic — migrações do Critério CRM.
#
# A URL do banco NÃO fica aqui, e nem sequer é gravada em memória neste
# config: migrations/env.py a lê de crm.db.sessao e entrega direto ao motor.
#
# Dois motivos. Primeiro, este arquivo é versionado, e credencial em arquivo
# versionado é vazamento. Segundo, configparser trata `%` como interpolação, e
# a senha chega codificada para endereço — passá-la por aqui derruba a migração
# com "invalid interpolation syntax".

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
